[uwsgi]
static-map = /static=/openedx/staticfiles/
static-map = /media=/openedx/media/
http = 0.0.0.0:8000
buffer-size = 8192
wsgi-file = $(SERVICE_VARIANT)/wsgi.py
processes = $(UWSGI_WORKERS)
thunder-lock = true
single-interpreter = true
enable-threads = true
# Fix 502 errors for closed connections
http-keepalive = 1
add-header = Connection: Keep-Alive
# Better startup/shutdown in docker:
die-on-term = true
lazy-apps = false
need-app = true
no-defer-accept = true
# Enable the master process for performance
master = true
# The http router allocates memory in proportion to the maximum number of open file
# descriptors. On some hosts, such as Kubernetes nodes running Ubuntu 26.04, this limit
# is so high (2^31) that the router is killed for lack of memory.
max-fd = 65536
# Clean up settings
py-call-osafterfork = true
vacuum = true
